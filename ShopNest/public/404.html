<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found - ShopNest</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="nav-brand">
        <img src="/images/logo.svg" alt="ShopNest Logo">
      </a>
    </div>
  </nav>

  <main class="container" style="min-height: 75vh; display: flex; align-items: center; justify-content: center;">
    <div style="text-align: center; padding: 60px 20px; max-width: 540px; background: white; border-radius: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-md);">
      <div style="font-size: 80px; margin-bottom: 10px; font-weight: 800; color: var(--primary);">404</div>
      <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 12px;">Oops! Page Not Found</h1>
      <p style="color: var(--text-muted); font-size: 16px; margin-bottom: 28px;">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
      <a href="/index.html" class="btn btn-primary" style="padding: 14px 32px; font-size: 16px; border-radius: var(--radius-full);">
        Return to Home Page
      </a>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
