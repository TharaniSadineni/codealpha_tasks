<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectHub - Mini Social Media Platform</title>
  <meta name="description" content="ConnectHub is a mini social media platform where developers and creators share posts, like, comment, and connect.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="logo">
        <div class="logo-icon">C</div>
        <span>ConnectHub</span>
      </a>
      <button class="mobile-toggle" aria-label="Toggle navigation">☰</button>
      <div id="navUserMenu" class="user-menu">
        <!-- Dynamically rendered by auth.js -->
      </div>
    </div>
  </nav>

  <!-- Main Feed Container -->
  <main class="main-container">
    <div class="grid-layout">
      <!-- Left Sidebar: Profile Summary -->
      <aside class="left-sidebar" id="leftSidebarContainer">
        <!-- Rendered by feed.js -->
      </aside>

      <!-- Center Feed: Posts -->
      <section class="center-feed">
        <div id="feedPostsContainer">
          <!-- Posts rendered by feed.js -->
        </div>
      </section>

      <!-- Right Sidebar: Who to Follow -->
      <aside class="right-sidebar">
        <div class="sidebar-card">
          <h3 class="widget-title">👥 Suggested Creators</h3>
          <div id="suggestedUsersContainer">
            <!-- Rendered by feed.js -->
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/feed.js"></script>
</body>
</html>
