<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectHub - Set New Password</title>
  <meta name="description" content="Set a new password for your ConnectHub account.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="logo">
        <div class="logo-icon">C</div>
        <span>ConnectHub</span>
      </a>
      <div id="navUserMenu" class="user-menu">
        <!-- Rendered by auth.js -->
      </div>
    </div>
  </nav>

  <!-- Reset Password Card -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">Please enter your new password below</p>
      </div>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label class="form-label" for="newPasswordInput">New Password</label>
          <input type="password" id="newPasswordInput" class="form-input" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPasswordInput">Confirm New Password</label>
          <input type="password" id="confirmPasswordInput" class="form-input" placeholder="Re-enter your new password" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Update Password</button>
      </form>

      <div class="auth-footer" style="margin-top: 24px;">
        Remembered your password? <a href="/login.html" class="auth-link">Back to Login</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const form = document.getElementById('resetPasswordForm');

      if (!token) {
        API.showToast('Invalid or missing password reset token', 'error');
        setTimeout(() => {
          window.location.href = '/forgot-password.html';
        }, 1500);
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('newPasswordInput').value;
        const confirmPassword = document.getElementById('confirmPasswordInput').value;

        if (newPassword !== confirmPassword) {
          API.showToast('Passwords do not match. Please check again.', 'error');
          return;
        }

        if (newPassword.length < 6) {
          API.showToast('Password must be at least 6 characters long', 'error');
          return;
        }

        try {
          const res = await API.resetPassword(token, newPassword);
          API.showToast(res.message || 'Password updated successfully!', 'success');

          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1200);
        } catch (err) {
          API.showToast(err.message || 'Password reset failed. Token may be expired.', 'error');
        }
      });
    });
  </script>
</body>
</html>
