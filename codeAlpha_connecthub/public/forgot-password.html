<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectHub - Forgot Password</title>
  <meta name="description" content="Request a password reset link for your ConnectHub account.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="logo">
        <div class="logo-icon">C</div>
        <span>ConnectHub</span>
      </a>
      <div id="navUserMenu" class="user-menu">
        <!-- Rendered by auth.js -->
      </div>
    </div>
  </nav>

  <!-- Forgot Password Card -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your registered email to receive a password reset link</p>
      </div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label class="form-label" for="forgotEmailInput">Email Address</label>
          <input type="email" id="forgotEmailInput" class="form-input" placeholder="e.g. aditya@connecthub.com" required>
        </div>

        <button type="submit" id="sendResetBtn" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>

      <!-- Password Reset Link Notification Box -->
      <div id="resetResultBox" style="display: none; margin-top: 20px; padding: 14px; background: rgba(99, 102, 241, 0.08); border: 1px solid var(--primary-light); border-radius: var(--radius-md); text-align: center;">
        <p style="font-size: 0.88rem; color: var(--text-dark); margin-bottom: 10px;">🔑 A password reset link has been generated. Please use it to create a new password.</p>
        <a id="resetLink" href="#" class="btn btn-secondary btn-sm btn-block">Proceed to Reset Password →</a>
      </div>

      <div class="auth-footer" style="margin-top: 24px;">
        Remembered your password? <a href="/login.html" class="auth-link">Back to Login</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgotPasswordForm');
      const resetBox = document.getElementById('resetResultBox');
      const resetLink = document.getElementById('resetLink');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('forgotEmailInput').value.trim();

        if (!email) {
          API.showToast('Please enter a valid email address', 'error');
          return;
        }

        try {
          const res = await API.forgotPassword(email);
          API.showToast(res.message || 'A password reset link has been generated.', 'success');

          if (res.resetUrl) {
            resetBox.style.display = 'block';
            resetLink.href = res.resetUrl;
          }
        } catch (err) {
          API.showToast(err.message || 'Error processing request', 'error');
        }
      });
    });
  </script>
</body>
</html>
