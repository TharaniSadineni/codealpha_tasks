<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - ShopNest</title>
  <meta name="description" content="View and track your past orders on ShopNest.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="nav-brand">
        <img src="/images/logo.svg" alt="ShopNest Logo">
      </a>
      <div class="nav-actions">
        <div id="nav-user-actions" style="display: flex; gap: 12px; align-items: center;"></div>
        <a href="/cart.html" class="cart-icon-btn" title="Shopping Cart">
          🛒
          <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main class="container" style="min-height: 70vh; margin-top: 30px; margin-bottom: 60px;">
    <!-- Breadcrumb -->
    <div style="font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border);">
      <a href="/account.html?tab=profile" style="color: var(--primary); text-decoration: none; font-weight: 700;">My Account</a> / <span style="color: var(--text-main); font-weight: 700;">My Purchase Orders</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1 style="font-size: 32px; font-weight: 800;">My Purchase Orders 📦</h1>
        <p style="color: var(--text-muted); font-size: 15px;">Track delivery progress and view receipt details</p>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="/account.html?tab=profile" class="btn btn-outline">← Back to My Account</a>
        <a href="/index.html" class="btn btn-primary">Continue Shopping</a>
      </div>
    </div>

    <!-- Orders Container -->
    <div id="orders-list-container" style="max-width: 900px; margin: 0 auto;">
      <div class="spinner"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding: 0;">
        <p>&copy; 2026 ShopNest E-Commerce. All Rights Reserved.</p>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
