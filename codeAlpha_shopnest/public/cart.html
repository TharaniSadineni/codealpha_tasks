<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - ShopNest</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="nav-brand">
        <img src="/images/logo.svg" alt="ShopNest Logo">
      </a>

      <div class="nav-search">
        <span class="nav-search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search products...">
      </div>

      <div class="nav-actions">
        <div id="nav-user-actions" style="display: flex; gap: 12px; align-items: center;"></div>
        <a href="/cart.html" class="cart-icon-btn" title="Shopping Cart">
          🛒
          <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main class="container" style="min-height: 70vh;">
    <div style="margin-top: 32px; display: flex; justify-content: space-between; align-items: center;">
      <h1 style="font-size: 32px; font-weight: 800;">Your Shopping Cart</h1>
      <a href="/index.html" style="font-size: 14px; font-weight: 600; color: var(--primary);">← Continue Shopping</a>
    </div>

    <!-- Dynamic Cart Content -->
    <div id="cart-page-content">
      <div class="spinner"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding: 0;">
        <p>&copy; 2026 ShopNest E-Commerce. All Rights Reserved.</p>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
