<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" style="background-color: #FFFFFF;">
    <!-- Studio Background -->
    <rect width="800" height="800" fill="#F8FAFC"/>
    
    <!-- Floor Shadow -->
    <ellipse cx="430" cy="710" rx="220" ry="24" fill="#000000" opacity="0.12"/>
    
    <!-- 3D Standalone Book -->
    <g transform="translate(180, 90)">
      <!-- Spine 3D Thickness -->
      <path d="M 400 30 L 435 50 L 435 590 L 400 570 Z" fill="#090D16"/>
      <path d="M 435 50 L 435 590 L 400 570 L 400 30 Z" fill="#1E293B" opacity="0.6"/>
      
      <!-- Pages Edge Bottom -->
      <path d="M 30 570 L 400 570 L 435 590 L 65 590 Z" fill="#E2E8F0"/>

      <!-- Front Cover Main Body -->
      <rect x="30" y="30" width="370" height="540" rx="6" fill="#1E1E24"/>

      <!-- Left Spine Shadow Overlay -->
      <rect x="30" y="30" width="18" height="540" fill="#000000" opacity="0.35"/>

      <!-- Accent Top Banner Line -->
      <rect x="50" y="60" width="330" height="5" fill="#F7DF1E"/>
      
      <!-- Badge -->
      <rect x="50" y="85" width="120" height="24" rx="4" fill="#F7DF1E"/>
      <text x="110" y="101" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#000000" text-anchor="middle">BESTSELLER</text>

      <!-- Visual Icon Graphic -->
      <circle cx="215" cy="220" r="42" fill="#F7DF1E" opacity="0.25"/>
      <text x="215" y="235" font-size="44" text-anchor="middle">⚡</text>

      <!-- Book Title -->
      <text x="50" y="320" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Mastering JavaScript &amp; Node.js</text>

      <!-- Subtitle -->
      <text x="50" y="450" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Asynchronous Code, Express APIs &amp; Microservices</text>

      <!-- Author -->
      <text x="50" y="530" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F7DF1E">David Vance</text>
    </g>
  </svg>